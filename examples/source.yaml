# Example source.yaml. Copy to ~/.config/agentcookie/source.yaml on the
# machine where you log in interactively (your laptop).

sink:
  # URL of the sink machine's /sync endpoint over your tailnet.
  # Use the MagicDNS hostname (not a 100.x IP) so the source follows
  # the sink after Tailscale re-auth gives it a new IP.
  url: http://my-mac-mini.tailnet.ts.net:9999/sync

chrome:
  # Defaults to ~/Library/Application Support/Google/Chrome/Default/Cookies
  # if omitted. Used by single-store commands (agent-sync); default export
  # merges all user profiles of enabled_products instead.
  db_path: ~/Library/Application Support/Google/Chrome/Default/Cookies

# Ordered list of browser products whose user profiles are discovered and
# merged by default export. Conflict precedence follows list order
# (name+domain+path). Unlisted products are never discovered or Keychain-
# probed. Guest and System profiles are never stores.
# enabled_products:
#   - chrome
#   - edge

# Optional single-store browser pin for agent-sync / cmux-sync. Omit for
# Google Chrome Default. Supported: chrome, edge.
# browser:
#   name: edge # chrome | edge
#   profile: Profile 2

peer:
  # Hostname of the sink machine. After `agentcookie pair --as source`
  # finishes, this is the filename under ~/.config/agentcookie/keys/.
  # The derived 32-byte key found there is used for transport AES-GCM.
  hostname: my-mac-mini.tailnet.ts.net

# Legacy security.shared_secret is still accepted as a fallback for users
# who haven't paired yet. After pairing, delete the field below entirely.
# security:
#   shared_secret: only-set-this-before-you-pair
